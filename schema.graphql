# Player entity - regroupe les infos d'un joueur
type Player @entity {
  id: ID! # Adresse du player (0x...)
  
  # Relations
  games: [Game!]! @derivedFrom(field: "player")
  tokens: [Token!]! @derivedFrom(field: "owner")
  
  # Stats agrégées (mises à jour lors de l'indexation)
  maxMaxAttempts: Int # Maximum de maxAttempts parmi tous les tokens du player
  totalGames: Int!
  totalWins: Int!
  totalTokens: Int!
  
  # Timestamps
  firstSeenAt: DateTime!
  firstSeenAtBlock: Int!
  lastActiveAt: DateTime!
  lastActiveAtBlock: Int!
}

type Contract @entity {
  id: ID!
  codeHash: String
  instantiatedAt: DateTime!
  instantiatedAtBlock: Int!
  instantiatedBy: String!
  
  # Relations to specific event types (guess_the_number)
  gameStartedEvents: [GameStartedEvent!] @derivedFrom(field: "contract")
  guessSubmittedEvents: [GuessSubmittedEvent!] @derivedFrom(field: "contract")
  clueGivenEvents: [ClueGivenEvent!] @derivedFrom(field: "contract")
  gameOverEvents: [GameOverEvent!] @derivedFrom(field: "contract")
  gameCancelledEvents: [GameCancelledEvent!] @derivedFrom(field: "contract")
  maxAttemptsUpdatedEvents: [MaxAttemptsUpdatedEvent!] @derivedFrom(field: "contract")
  
  # Relations to ERC721 event types
  mintEvents: [MintEvent!] @derivedFrom(field: "contract")
  burntEvents: [BurntEvent!] @derivedFrom(field: "contract")
  transferEvents: [TransferEvent!] @derivedFrom(field: "contract")
  approvalEvents: [ApprovalEvent!] @derivedFrom(field: "contract")
  approvalForAllEvents: [ApprovalForAllEvent!] @derivedFrom(field: "contract")
}

# Game started event
type GameStartedEvent @entity {
  id: ID!
  contract: Contract!
  blockNumber: Int! @index
  timestamp: DateTime! @index
  extrinsicHash: String @index
  contractAddress: String!
  
  # Game started specific fields
  gameNumber: BigInt! @index
  player: String!
  minNumber: Int!
  maxNumber: Int!
}

# Guess submitted event
type GuessSubmittedEvent @entity {
  id: ID!
  contract: Contract!
  blockNumber: Int! @index
  timestamp: DateTime! @index
  extrinsicHash: String @index
  contractAddress: String!
  
  # Guess submitted specific fields
  gameNumber: BigInt! @index
  player: String!
  attemptNumber: Int!
  guess: Int!
}

# Clue given event
type ClueGivenEvent @entity {
  id: ID!
  contract: Contract!
  blockNumber: Int! @index
  timestamp: DateTime! @index
  extrinsicHash: String @index
  contractAddress: String!
  
  # Clue given specific fields
  gameNumber: BigInt! @index
  player: String!
  attemptNumber: Int!
  guess: Int!
  result: String!
}

type Game @entity {
  id: ID!
  gameNumber: BigInt! @index
  player: Player! # Relation vers le player
  playerAddress: String! # Adresse pour les requêtes directes
  minNumber: Int!
  maxNumber: Int!
  attempt: Int!
  lastGuess: Int
  lastClue: String
  createdAt: DateTime! @index
  createdAtBlock: Int! @index
  contract: Contract!
  
  # ✅ NOUVEAU: Historique des tentatives
  guessHistory: [GuessHistoryItem!]!
  
  # ✅ NOUVEAU: Champs pour v0.1.3
  isOver: Boolean
  won: Boolean
  target: Int
  cancelled: Boolean
  maxAttempts: Int
}

# ✅ NOUVEAU: Type pour l'historique des tentatives
type GuessHistoryItem {
  attemptNumber: Int!
  guess: Int!
  result: String!
}

# Game over event (v0.1.3)
type GameOverEvent @entity {
  id: ID!
  contract: Contract!
  blockNumber: Int! @index
  timestamp: DateTime! @index
  extrinsicHash: String @index
  contractAddress: String!
  
  # Game over specific fields
  gameNumber: BigInt! @index
  player: String!
  win: Boolean!
  target: Int!
}

# Game cancelled event (v0.1.3)
type GameCancelledEvent @entity {
  id: ID!
  contract: Contract!
  blockNumber: Int! @index
  timestamp: DateTime! @index
  extrinsicHash: String @index
  contractAddress: String!
  
  # Game cancelled specific fields
  gameNumber: BigInt! @index
  player: String!
}

# Max attempts updated event (v0.1.3)
type MaxAttemptsUpdatedEvent @entity {
  id: ID!
  contract: Contract!
  blockNumber: Int! @index
  timestamp: DateTime! @index
  extrinsicHash: String @index
  contractAddress: String!
  
  # Max attempts updated specific fields
  gameNumber: BigInt! @index
  player: String!
  maxAttempts: Int!
}

# ============================================
# ERC721 Events
# ============================================

# Mint event (ERC721)
type MintEvent @entity {
  id: ID!
  contract: Contract!
  blockNumber: Int! @index
  timestamp: DateTime! @index
  extrinsicHash: String @index
  contractAddress: String!
  
  # Mint specific fields
  tokenId: BigInt! @index
  maxAttempts: BigInt
}

# Burnt event (ERC721)
type BurntEvent @entity {
  id: ID!
  contract: Contract!
  blockNumber: Int! @index
  timestamp: DateTime! @index
  extrinsicHash: String @index
  contractAddress: String!
  
  # Burnt specific fields
  tokenId: BigInt! @index
}

# Transfer event (ERC721)
type TransferEvent @entity {
  id: ID!
  contract: Contract!
  blockNumber: Int! @index
  timestamp: DateTime! @index
  extrinsicHash: String @index
  contractAddress: String!
  
  # Transfer specific fields
  from: String @index
  to: String @index
  tokenId: BigInt! @index
}

# Approval event (ERC721)
type ApprovalEvent @entity {
  id: ID!
  contract: Contract!
  blockNumber: Int! @index
  timestamp: DateTime! @index
  extrinsicHash: String @index
  contractAddress: String!
  
  # Approval specific fields
  from: String! @index
  to: String! @index
  tokenId: BigInt! @index
}

# ApprovalForAll event (ERC721)
type ApprovalForAllEvent @entity {
  id: ID!
  contract: Contract!
  blockNumber: Int! @index
  timestamp: DateTime! @index
  extrinsicHash: String @index
  contractAddress: String!
  
  # ApprovalForAll specific fields
  owner: String! @index
  operator: String! @index
  approved: Boolean!
}

# Token entity (ERC721) - représente un NFT
type Token @entity {
  id: ID! # Format: {contractAddress}-{tokenId}
  contract: Contract!
  tokenId: BigInt! @index
  owner: Player! # Relation vers le player
  ownerAddress: String! @index # Adresse pour les requêtes directes
  mintedAt: DateTime! @index
  mintedAtBlock: Int! @index
  maxAttempts: BigInt
  burnt: Boolean!
  burntAt: DateTime
  burntAtBlock: Int
}
