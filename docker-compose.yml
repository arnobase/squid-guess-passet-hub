# Squid Guess Indexer - Docker Compose
# Copy .env.example to .env and set RPC_URL_WS, GUESS_THE_NUMBER_CONTRACTS, ERC721_CONTRACTS (and DB_* if needed).
# Variables in the "environment" section are read from the host .env when you run `docker compose up`.
name: squid-guess

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: squid_guess_indexer
      POSTGRES_PASSWORD: postgres
    shm_size: 1gb
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      # Required: set in .env (no defaults)
      - RPC_URL_WS=${RPC_URL_WS}
      - GUESS_THE_NUMBER_CONTRACTS=${GUESS_THE_NUMBER_CONTRACTS}
      - ERC721_CONTRACTS=${ERC721_CONTRACTS}
      # Optional: block range, finality, logs
      - START_BLOCK=${START_BLOCK:-}
      - END_BLOCK=${END_BLOCK:-}
      - FINALITY_CONFIRMATION=${FINALITY_CONFIRMATION:-100}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=${NODE_ENV:-development}
      # Optional: override target list (otherwise derived from the two contract vars above)
      - TARGET_CONTRACTS=${TARGET_CONTRACTS:-}
      # DB (fixed for compose)
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=squid_guess_indexer
      - DB_USER=postgres
      - DB_PASS=postgres
    restart: unless-stopped
    command: ["./docker-start.sh"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
      - indexer
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=squid_guess_indexer
      - DB_USER=postgres
      - DB_PASS=postgres
    ports:
      - "4000:4000"
    restart: unless-stopped
    command: ["sh", "-c", "sleep 10 && yarn serve"]

volumes:
  postgres_data:
